<div *ngIf="pokemonList">
  <ul>
    <li *ngFor="let pokemon of pokemonList">
      {{ pokemon.name }} (ID: {{ pokemon.id }}) - Caught: {{ pokemon.caught }}
      <button (click)="toggleCaught(pokemon)">Toggle Caught</button>
    </li>
  </ul>

  <button (click)="previousPage()" [disabled]="offset === 0">Precedente</button>
  <button (click)="nextPage()">Successiva</button>
</div>
